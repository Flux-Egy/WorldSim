# WorldSim CI. See GITHUB_ACTIONS.md for setup (Unity license secrets) and the first-run bootstrap.
# Action versions verified on 2026-11-17: game-ci/unity-builder v6.0.0 (thin wrapper over the
# game-ci CLI), unityci/editor:ubuntu-6000.3.28f1-android-3. 2026-11-19: game-ci/unity-test-runner
# v4.4.0 is also a thin wrapper that runs `game-ci test` (CLI v0.1.76 has the command), and the
# CLI reads UNITY_EMAIL/UNITY_PASSWORD from its environment, so Personal licensing works there too.
#
# Unity version: both actions default unityVersion to 'auto', so the CLI reads
# ProjectSettings/ProjectVersion.txt (currently 6000.3.28f1). Nothing is hard-coded here.
#
# When it runs: tests (.NET + Unity EditMode) on every push to any branch and on pull requests.
# The Android build runs after the tests pass; in a private repo only on main (saves Actions
# minutes, since public repos get free minutes and private ones don't).
#
# Licensing: Personal license via UNITY_EMAIL + UNITY_PASSWORD only (the game-ci CLI's
# "personal" method requests a seat from Unity's licensing service and returns it on exit).
# Unity removed .alf/.ulf manual activation for Personal licenses, so there is no license file.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Never cancel a running build: a killed job can leak its Personal license seat, which then
# blocks every later run on the account until it is released at id.unity.com.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Plain .NET, no Unity license: compiles WorldSim.Core and runs its determinism tests (C# 9,
  # warnings as errors, overflow checking on).
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Every Assets file has a committed .meta
        run: python3 ci/make_meta.py --check
      - name: Core unit tests
        run: dotnet test Tools/CoreTests --logger "console;verbosity=normal" --logger "trx;LogFileName=core-tests.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-results
          path: Tools/CoreTests/TestResults/

  # Secrets cannot be used in job-level `if:`, so this job exposes whether a license is configured.
  # Forks and repos without secrets still get core-tests, and the Unity jobs are skipped instead of failing.
  license-check:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci
      - id: check
        env:
          HAS_LICENSE: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_EMAIL / UNITY_PASSWORD secrets not set. Unity jobs skipped. See GITHUB_ACTIONS.md."
            exit 0
          fi
          # Booleans only, never values. A format problem fails here, before any Unity login
          # attempt (repeated failed logins can lock the Unity account).
          python3 ci/check_unity_credentials.py
          echo "available=true" >> "$GITHUB_OUTPUT"

  # Unity EditMode tests inside the real Unity Editor (the same tests as core-tests, plus anything
  # that needs UnityEngine). Runs before the build, so at most one Unity seat is in use per run.
  unity-tests:
    needs: [core-tests, license-check]
    if: needs.license-check.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-EditMode-

      - name: Unity EditMode tests
        uses: game-ci/unity-test-runner@v4.4.0
        timeout-minutes: 30 # same guard as the builds: Unity batchmode has hung once at startup
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticated GitHub API calls (CLI download)
        with:
          cliVersion: v0.1.76 # pinned, same CLI as the builds
          testMode: editmode
          # Only our test assembly. Run 44524214801 also ran ~2,900 package tests (Entities was
          # listed under "testables"); our 51 passed, 4 Entities performance tests failed.
          customParameters: -assemblyNames WorldSim.Tests.EditMode
          artifactsPath: unity-test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-editmode-test-results
          path: unity-test-results/
          if-no-files-found: warn

  build-android:
    needs: [core-tests, license-check, unity-tests]
    # Public repo: every branch. Private repo: main only.
    if: >-
      needs.license-check.outputs.available == 'true' &&
      (github.event.repository.private == false || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One Unity job at a time per account: Personal accounts have very few seats.
    steps:
      # The Unity Android image is large and a hosted runner starts with limited free disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versioning: Semantic derives the version from git history and tags

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      # Pass 1: headless project setup (URP asset, Boot scene, Input System handler, Android
      # settings). Kept separate because the input-handler change needs an Editor restart.
      - name: Unity bootstrap
        uses: game-ci/unity-builder@v6
        # Normal: ~6 min. Run 44275823834 hung inside Unity's own startup (after
        # "Unloading 19 Unused Serialized files", before executeMethod) for 78 min.
        timeout-minutes: 25
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticated GitHub API calls (higher rate limit)
        with:
          targetPlatform: Android
          cliVersion: v0.1.76 # pinned: 'latest' needs an unauthenticated API lookup that hit HTTP 403 (run 44271009767)
          buildMethod: WorldSim.EditorTools.WorldSimCI.Bootstrap
          versioning: None
          allowDirtyBuild: true

      # The files Unity generated (ProjectSettings, .meta files, Boot scene, URP assets).
      # Commit these once (GITHUB_ACTIONS.md, "First run"), so later builds start from them.
      - uses: actions/upload-artifact@v7
        with:
          name: project-bootstrap-files
          path: |
            ProjectSettings/
            Packages/packages-lock.json
            Assets/
          if-no-files-found: warn

      # Pass 2: Release build. IL2CPP, ARM64, stripping High (WorldSimBuild enforces this).
      - name: Unity build (Release, IL2CPP ARM64)
        id: build
        uses: game-ci/unity-builder@v6
        timeout-minutes: 60 # normal: ~15 min
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticated GitHub API calls (higher rate limit)
        with:
          targetPlatform: Android
          cliVersion: v0.1.76 # pinned: 'latest' needs an unauthenticated API lookup that hit HTTP 403 (run 44271009767)
          buildMethod: WorldSim.EditorTools.WorldSimBuild.BuildReleaseCI
          versioning: Semantic
          allowDirtyBuild: true # pass 1 leaves generated files in the workspace

      - uses: actions/upload-artifact@v7
        with:
          name: WorldSim-android-release
          path: Builds/Android/*.apk
          if-no-files-found: error
