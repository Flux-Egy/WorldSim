# Checks the format of UNITY_EMAIL / UNITY_PASSWORD without printing them and WITHOUT
# contacting Unity, so it can be run as often as needed with no risk of locking the account.
#   gh workflow run credentials-check.yml -R Flux-Egy/WorldSim
name: Credentials check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci
      - name: Check Unity credential format (no values printed)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: python3 ci/check_unity_credentials.py
